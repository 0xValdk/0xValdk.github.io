<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas des sites industriels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<div class="atlas">

  <aside class="panel" id="panel">
    <section id="view-list">
      <div class="head">
        <a class="back mono" href="index.html">← Profil</a>
        <div class="kicker mono"><span class="dot"></span><span>Interventions sur site</span></div>
        <h1>Atlas des sites industriels</h1>
        <p class="sub" id="profile"></p>
        <div class="stats">
          <div><b id="st-sites">0</b><span>Sites</span></div>
          <div><b id="st-countries">0</b><span>Pays</span></div>
          <div><b id="st-years">—</b><span id="st-years-label">Années</span></div>
        </div>
        <div class="search">
          <label for="q" class="sr">Rechercher un site</label>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
          <input id="q" type="search" placeholder="Site, ville, pays, secteur…" autocomplete="off">
        </div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="list">
        <div class="list-label mono" id="list-label"></div>
        <div id="list"></div>
        <div class="empty" id="empty" hidden>
          <span>Aucun site ne correspond</span>
          <button class="linkbtn" id="clear" type="button">Réinitialiser les filtres</button>
        </div>
      </div>
    </section>
    <section id="view-detail" hidden></section>
  </aside>

  <div class="map" id="map">
    <div class="layer" id="layer">
      <img id="img-base" alt="Carte de l’Europe" draggable="false">
      <img id="img-reg" src="carte/regions.svg" alt="" draggable="false">
      <img id="img-sub" src="carte/subregions.svg" alt="" draggable="false">
    </div>
    <div class="labels" id="labels"></div>
    <div class="pins" id="pins"></div>
    <div class="tip" id="tip" hidden><b></b><span></span></div>

    <div class="hint">Glisser pour se déplacer · molette ou double-clic pour zoomer</div>

    <div class="controls">
      <div class="group">
        <button class="ctl" id="zin" type="button" aria-label="Zoomer" title="Zoomer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <span class="sep"></span>
        <button class="ctl" id="zout" type="button" aria-label="Dézoomer" title="Dézoomer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      </div>
      <div class="group">
        <button class="ctl" id="fit" type="button" aria-label="Cadrer sur tous les sites" title="Cadrer sur les sites"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V5h4M16 5h4v4M20 15v4h-4M8 19H4v-4"/><circle cx="12" cy="12" r="2.2"/></svg></button>
        <span class="sep"></span>
        <button class="ctl" id="europe" type="button" aria-label="Vue Europe" title="Vue Europe"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg></button>
      </div>
    </div>

    <div class="scale">
      <div class="bar"><span id="scale-bar"></span><span class="mono" id="scale-label"></span></div>
      <span class="mono src">Fond : Natural Earth · Mercator</span>
    </div>
  </div>
</div>

<script src="mes-sites.js"></script>
<script src="donnees/lieux.js"></script>
<script src="app/app.js"></script>
</body>
</html>
